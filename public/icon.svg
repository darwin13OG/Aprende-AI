<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070d1a" />
      <stop offset="50%" stop-color="#0c1529" />
      <stop offset="100%" stop-color="#060a14" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#06b6d4" stroke-opacity="0.25" stroke-width="4" />

  <!-- Subtle glow aura in center -->
  <circle cx="256" cy="256" r="140" fill="#06b6d4" fill-opacity="0.12" filter="url(#neon)" />

  <!-- Central Symbol: Elegant Graduation / Brain & Sparkle Synthesis -->
  <g transform="translate(256, 256) scale(1.15)">
    <!-- Central Large Sparkle -->
    <path d="M0 -90 C0 -25 25 0 90 0 C25 0 0 25 0 90 C0 25 -25 0 -90 0 C-25 0 0 -25 0 -90 Z"
          fill="url(#glowGrad)" filter="url(#neon)" />

    <!-- Core highlight -->
    <circle cx="0" cy="0" r="14" fill="#ffffff" />

    <!-- Orbiting Accent Sparkle 1 -->
    <path d="M70 -70 C70 -48 84 -35 106 -35 C84 -35 70 -22 70 0 C70 -22 56 -35 34 -35 C56 -35 70 -48 70 -70 Z"
          fill="#38bdf8" />

    <!-- Orbiting Accent Sparkle 2 -->
    <path d="M-75 60 C-75 42 -62 30 -44 30 C-62 30 -75 18 -75 0 C-75 18 -88 30 -106 30 C-88 30 -75 42 -75 60 Z"
          fill="#a855f7" />
  </g>
</svg>
